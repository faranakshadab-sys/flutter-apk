name: Clean Flutter Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true

      - name: Create fresh Flutter project
        run: |
          flutter create temp_app
          rm -rf temp_app/lib
          rm -rf temp_app/pubspec.yaml

      - name: Copy your project files into fresh app
        run: |
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/
          cp -r assets temp_app/ || true
          cp -r android temp_app/ || true
          cp -r ios temp_app/ || true

      - name: Fix dependencies
        working-directory: temp_app
        run: |
          flutter pub get

      - name: Build APK
        working-directory: temp_app
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
